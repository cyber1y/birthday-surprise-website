<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Wishes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@600;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-blur blur-one"></div>
    <div class="bg-blur blur-two"></div>
    <canvas id="particleLayer"></canvas>

    <main class="page-shell">
        <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html" class="nav-link">Home</a>
            <a href="surprise.html" class="nav-link">Surprise</a>
            <a href="letter.html" class="nav-link">Letter</a>
            <a href="gallery.html" class="nav-link">Gallery</a>
            <a href="wishes.html" class="nav-link active">Wishes</a>
            <a href="finale.html" class="nav-link">Finale</a>
            <button class="nav-link" data-music>🔇 Music Off</button>
        </nav>

        <header class="site-header">
            <div class="badge">Leave a message</div>
            <h1 class="hero-title">Birthday Wishes</h1>
            <p class="hero-subtitle">Drop a wish for our birthday star. Every message becomes a memory.</p>
        </header>

        <section class="section">
            <div class="glass-panel wish-form reveal">
                <form id="wishForm">
                    <div class="field">
                        <label for="wishName">Your name</label>
                        <input type="text" id="wishName" placeholder="Your name here..." maxlength="50">
                    </div>
                    <div class="field">
                        <label for="wishMessage">Your wish 💌</label>
                        <textarea id="wishMessage" rows="4" placeholder="Write something heartfelt..." maxlength="500" required></textarea>
                    </div>
                    <button type="submit" class="pill-btn btn-primary">Send my wish</button>
                </form>
            </div>

            <div class="wish-list reveal" id="wishList">
                <p class="lead">Loading wishes...</p>
            </div>
        </section>
    </main>

    <footer class="footer">Made with &#10084;&#65039; for the most amazing person</footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
